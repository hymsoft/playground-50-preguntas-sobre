<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll-Driven Animations</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="barra-progreso"></div>
  <section class="seccion">
    <h1>Sección 1</h1>
    <p>Contenido que aparece al hacer scroll.</p>
  </section>
  <section class="seccion">
    <h2>Sección 2</h2>
    <p>Más contenido para generar scroll.</p>
  </section>
  <section class="seccion">
    <h2>Sección 3</h2>
    <p>El número animado por scroll:</p>
    <p><strong class="numero-destacado">100</strong></p>
  </section>
</body>
</html>
