<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conectar CSS con HTML</title>
  <!-- Método 1: Externo (recomendado) -->
  <link rel="stylesheet" href="style.css">

  <!-- Método 2: Interno -->
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>
  <!-- Método 3: En línea (no recomendado) -->
  <h1 style="color: navy;">Título Principal</h1>
  <p>Este párrafo hereda los estilos internos aplicados al body.</p>
</body>
</html>
